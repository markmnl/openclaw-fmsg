name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12

      - name: Set package version from release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $RELEASE_TAG must use stable semantic version format vX.Y.Z" >&2
            exit 1
          fi
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install OpenClaw peer for validation
        run: |
          npm install --prefix "$RUNNER_TEMP/openclaw-peer" --no-save --package-lock=false --ignore-scripts openclaw@2026.8.1
          ln -s "$RUNNER_TEMP/openclaw-peer/node_modules/openclaw" node_modules/openclaw

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build precompiled JavaScript
        run: npm run build

      - name: Verify committed build output
        run: git diff --exit-code -- dist

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish package
        run: npm publish --access public
